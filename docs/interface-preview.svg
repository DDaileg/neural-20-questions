<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Neural 20 Questions browser interface preview</title>
  <desc id="desc">A representative preview showing the current question, candidate count, yes and no buttons, and a reasoning trace.</desc>
  <rect width="1200" height="700" fill="#f6f8fb"/>
  <rect x="145" y="55" width="910" height="590" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="205" y="125" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#17324d">Neural 20 Questions</text>
  <text x="205" y="158" font-family="Arial, sans-serif" font-size="19" fill="#5d6873">Explainable guessing with entropy, hard filtering, and semantic ranking</text>
  <rect x="205" y="195" width="220" height="78" rx="10" fill="#eaf4f6"/>
  <text x="225" y="223" font-family="Arial, sans-serif" font-size="15" fill="#5d6873">CANDIDATES REMAINING</text>
  <text x="225" y="258" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#167d8d">10</text>
  <text x="205" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#5d6873">QUESTION 2</text>
  <text x="205" y="370" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#20262e">Is it big?</text>
  <rect x="205" y="404" width="235" height="58" rx="9" fill="#167d8d"/>
  <rect x="460" y="404" width="235" height="58" rx="9" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
  <text x="307" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Yes</text>
  <text x="577" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">No</text>
  <text x="205" y="520" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Reasoning trace</text>
  <rect x="205" y="542" width="790" height="58" rx="6" fill="#f2f5f8"/>
  <text x="225" y="568" font-family="Arial, sans-serif" font-size="15" fill="#20262e">Is it alive?  ·  Yes  ·  entropy 1.000  ·  10 remaining</text>
  <text x="225" y="589" font-family="Arial, sans-serif" font-size="14" fill="#5d6873">Boolean answers eliminate candidates; semantic similarity ranks survivors.</text>
  <text x="995" y="675" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#7a8793">Representative interface preview</text>
</svg>
